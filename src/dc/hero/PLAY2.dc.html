class Component extends DCLogic {
  constructor(p) { super(p); this.state = { seek: 0, playing: false, off: false }; }
  go(i) {
    this.setState({ seek: i, off: true, playing: true });
    setTimeout(() => this.setState({ off: false }), 60);
  }
  renderVals() {
    const s = this.state;
    const v = {
      cls: 's' + s.seek + (s.playing ? '' : ' paused') + (s.off ? ' off' : ''),
      label: s.playing ? '❚❚ Tạm dừng' : '▶ Phát',
      toggle: () => this.setState({ playing: !s.playing }),
      replay: () => this.go(0)
    };
    for (let i = 0; i < 7; i++) v['go' + i] = () => this.go(i);
    return v;
  }
}
