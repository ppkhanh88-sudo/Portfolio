tify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1536,"height":1044}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { time: 'noon', weather: 'sun', music: false, mx: 0, my: 0, mk: 3 }; }
  _mountScene() {
    const go = () => {
      if (!this._cv || this.ctrl || this._dead) return;
      if (!window.PixelHero) { this._t = setTimeout(go, 80); return; }
      this.ctrl = window.PixelHero.mount(this._cv, {
        layout: 'island', hour: 12.5, seed: 41, sky: 'none',
        onChange: (s) => this.setState({ time: s.time, weather: s.weather, music: s.music }),
        onLayout: (a) => { const k = a.k || 2, bx = a.feet.x / k - 14, y0 = a.feet.y / k + 1; this.setState({ mx: Math.round((bx - 8) * k), my: Math.round((y0 - 64) * k), mk: k }); }
      });
      this.ctrl.setGirlHidden(true);
    };
    go();
  }
  componentWillUnmount() { this._dead = true; clearTimeout(this._t); if (this.ctrl) this.ctrl.destroy(); this.ctrl = null; }
  renderVals() {
    const s = this.state, P = (b) => String(!!b);
    if (!this._h) {
      const c = () => this.ctrl;
      this._h = {
        setCanvas: (el) => { if (el && el !== this._cv) { this._cv = el; this._mountScene(); } },
        onClick: (e) => { if (c()) c().click(e.clientX, e.clientY); },
        onMove: (e) => { if (c()) c().move(e.clientX, e.clientY); },
        onLeave: () => { if (c()) c().move(-9999, -9999); },
        musicToggle: () => { if (c()) c().toggleMusic(); }
      };
      ['noon', 'afternoon', 'night'].forEach((t) => { this._h['t_' + t] = () => { if (c()) c().setTime(t); this.setState({ time: t }); }; });
      ['sun', 'rain', 'rainbow'].forEach((w) => { this._h['w_' + w] = () => { if (c()) c().setWeather(w); this.setState({ weather: w }); }; });
    }
    return Object.assign({}, this._h, {
      meStyle: 'left: ' + s.mx + 'px; top: ' + s.my + 'px; --w: ' + (52 * s.mk) + 'px; --h: ' + (64 * s.mk) + 'px; opacity: ' + (s.mx ? 1 : 0),
      pNoon: P(s.time === 'noon'), pAfternoon: P(s.time === 'afternoon'), pNight: P(s.time === 'night'),
      pSun: P(s.weather === 'sun'), pRain: P(s.weather === 'rain'), pRainbow: P(s.weather === 'rainbow'), pMusic: P(s.music)
    });
  }
}
</script>
